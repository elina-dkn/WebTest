<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#302939">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <title>Progress</title>
</head>
<body>
<main class="content">
  <h1>Progress</h1>

  <div id="globalError" class="error-message" role="alert" hidden></div>

  <section class="form-panel calendar-panel">
    <h2>Workout Calendar</h2>

    <div class="calendar-header">
      <button id="prevMonth" class="calendar-nav" type="button" aria-label="Previous month">‹</button>
      <h3 id="calendarMonth"></h3>
      <button id="nextMonth" class="calendar-nav" type="button" aria-label="Next month">›</button>
    </div>

    <div class="calendar-weekdays" aria-hidden="true">
      <span>Mon</span><span>Tue</span><span>Wed</span>
      <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>

    <div id="workoutCalendar" class="calendar-grid"></div>
    <div id="calendarLegend" class="calendar-legend"></div>

    <section class="selected-day">
      <h3 id="selectedDate"></h3>
      <div id="selectedWorkout"></div>
    </section>
  </section>

  <section class="progress-section">
    <h2>Exercise Progress</h2>

    <section class="form-panel">
      <label class="field">
        <span>Exercise</span>
        <select id="select"></select>
      </label>
    </section>

    <p id="progressEmpty" class="status-message" hidden></p>

    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
  </section>
</main>

<footer class="navbar" aria-label="Main navigation">
  <a href="index.html">Home</a>
  <a href="exerciseList.html">My Exercises</a>
  <a href="progress.html" class="active">Progress</a>
  <a href="user.html">Profile</a>
</footer>

<script type="module" src="js/pages/progressPage.js"></script>
</body>
</html>
