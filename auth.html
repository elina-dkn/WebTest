<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#302939">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Workout Froggy</title>
</head>
<body class="auth-page">
<main class="auth-content">
  <h1>Workout Froggy</h1>
  <form id="authForm" class="auth-panel">
    <label class="field">
      <span>Email</span>
      <input class="userId" id="email" type="email" placeholder="Email" autocomplete="email" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input class="userId" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    </label>

    <div class="buttonsContainer">
      <button id="loginButton" type="submit" class="auth">Login</button>
      <button id="registerButton" type="button" class="auth">Register</button>
    </div>
    <p id="authError" class="error-message" role="alert" hidden></p>
  </form>
</main>

<script type="module" src="js/pages/authPage.js"></script>
</body>
</html>
