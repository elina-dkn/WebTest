<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#302939">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Add Exercise</title>
</head>
<body>
<main class="content">
  <h1>Add Exercise</h1>
  <div id="globalError" class="error-message" role="alert" hidden></div>

  <form id="exerciseForm" class="form-panel">
    <label class="field">
      <span>Exercise name</span>
      <input class="addinput" id="newExercise" placeholder="Exercise name" type="text" required maxlength="100">
    </label>
    <label class="field">
      <span>Weight</span>
      <input class="addinput" id="newExerciseWeight" placeholder="Weight (optional)" type="number" min="0" step="any">
    </label>
    <label class="field">
      <span>Sets</span>
      <input class="addinput" id="newExerciseSets" placeholder="Sets (optional)" type="number" min="0" step="1">
    </label>
    <label class="field">
      <span>Reps</span>
      <input class="addinput" id="newExerciseReps" placeholder="Reps (optional)" type="number" min="0" step="1">
    </label>

    <div class="field">
      <span>Select splits</span>
      <div id="splitArea" class="split-area" aria-label="Workout splits"></div>
    </div>

    <div class="form-actions">
      <button id="addExerciseButton" type="submit" class="button">Add</button>
      <a href="exerciseList.html" class="button secondary-button">Cancel</a>
    </div>
  </form>
</main>

<footer class="navbar" aria-label="Main navigation">
  <a href="index.html">Home</a>
  <a href="exerciseList.html" class="active">My Exercises</a>
  <a href="progress.html">Progress</a>
  <a href="user.html">Profile</a>
</footer>

<script type="module" src="js/pages/addExercisePage.js"></script>
</body>
</html>
